<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONVO OS | Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="glass-bg">
  <!-- Top Navbar -->
  <header class="navbar neumorphism-card">
    <h2>ONVO OS</h2>
    <button id="fab-btn" class="fab">💡</button>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar glass-card">
    <ul>
      <li id="dashboard-link">Dashboard</li>
      <li id="tasks-link">Tasks</li>
      <li id="calendar-link">Content Calendar</li>
      <li id="team-link">Team Tracker</li>
      <li id="founder-tools-link" class="founder-only">Founder Tools</li>
      <li id="logout-btn">Logout</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <section id="dashboard-section">
      <h3>Dashboard</h3>
      <div class="cards-container">
        <div class="card glass-card">
          <h4>Tasks Completed</h4>
          <p id="tasks-completed">0</p>
        </div>
        <div class="card glass-card">
          <h4>Team Activity</h4>
          <p id="team-activity">0%</p>
        </div>
        <div class="card glass-card">
          <h4>Weekly Progress</h4>
          <div class="progress-bar">
            <div id="weekly-progress" class="progress-fill"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="tasks-section" class="hidden">
      <h3>Task Management</h3>
      <button class="btn founder-only" id="new-task-btn">New Task</button>
      <div id="tasks-list" class="tasks-list"></div>
    </section>

    <section id="calendar-section" class="hidden">
      <h3>Content Calendar</h3>
      <input type="file" id="content-upload" multiple />
      <div id="calendar-preview" class="calendar-preview"></div>
    </section>

    <section id="team-section" class="hidden">
      <h3>Team Tracker</h3>
      <div id="team-list" class="team-list"></div>
    </section>

    <section id="founder-tools-section" class="hidden founder-only">
      <h3>Founder Tools</h3>
      <button id="add-user-btn" class="btn">Add New User</button>
      <div id="users-list"></div>
    </section>
  </main>

  <!-- Modals -->
  <div id="modal-container"></div>

  <!-- Scripts -->
  <script src="ai.js"></script>
  <script>
    // Basic Page Routing
    const sections = {
      dashboard: document.getElementById('dashboard-section'),
      tasks: document.getElementById('tasks-section'),
      calendar: document.getElementById('calendar-section'),
      team: document.getElementById('team-section'),
      founder: document.getElementById('founder-tools-section')
    };

    function showSection(name) {
      for (const sec in sections) {
        sections[sec].classList.add('hidden');
      }
      sections[name].classList.remove('hidden');
    }

    document.getElementById('dashboard-link').onclick = () => showSection('dashboard');
    document.getElementById('tasks-link').onclick = () => showSection('tasks');
    document.getElementById('calendar-link').onclick = () => showSection('calendar');
    document.getElementById('team-link').onclick = () => showSection('team');
    document.getElementById('founder-tools-link').onclick = () => showSection('founder');

    document.getElementById('logout-btn').onclick = async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
